   <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Activité Commits</title>
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        
        <style>
            /* Reset CSS */
            * { margin: 0; padding: 0; box-sizing: border-box; }

            body {
                font-family: 'Poppins', sans-serif;
                /* Le même dégradé que la page contact */
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #333;
                padding: 20px;
            }

            /* La carte blanche centrale */
            .chart-container {
                background: white;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 15px 25px rgba(0,0,0,0.2);
                width: 100%;
                max-width: 1000px; /* Plus large pour le graphique */
                text-align: center;
            }

            h2 {
                margin-bottom: 10px;
                color: #444;
                font-weight: 600;
            }
            
            p.subtitle {
                color: #777;
                margin-bottom: 20px;
                font-size: 0.9em;
            }

            #chart_div {
                width: 100%; 
                height: 500px;
            }
        </style>
    </head>
    <body>

        <div class="chart-container">
            <h2>Activité du Repository</h2>
            <p class="subtitle">Analyse minute par minute des commits</p>
            
            <div id="chart_div"></div>
        </div>
        
        <script>
          google.charts.load('current', { packages: ['corechart'] });
          google.charts.setOnLoadCallback(drawChart);

          function drawChart() {
            // Récupération des données injectées par Python
            var data = google.visualization.arrayToDataTable({{ data_for_chart | tojson }});

            var options = {
              title: 'Nombre de commits par minute',
              titleTextStyle: { color: '#444', fontName: 'Poppins', fontSize: 18 },
              hAxis: {
                title: 'Minute',
                textStyle: { color: '#666', fontName: 'Poppins' },
                titleTextStyle: { color: '#666', fontName: 'Poppins' }
              },
              vAxis: {
                title: 'Nombre de commits',
                textStyle: { color: '#666', fontName: 'Poppins' },
                titleTextStyle: { color: '#666', fontName: 'Poppins' }
              },
              legend: { position: 'none' },
              colors: ['#764ba2'], // Couleur violette pour assortir au fond
              backgroundColor: 'transparent',
              animation: {
                startup: true,
                duration: 1000,
                easing: 'out',
              }
            };

            var chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
            chart.draw(data, options);
          }
        </script>
    </body>
    </html>
